[package]
name = "search-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
astercore = { workspace = true }
platform-windows = { workspace = true }
shell-api = { workspace = true }
search-core = { workspace = true }
search-providers = { workspace = true }
ipc = { workspace = true }
diagnostics = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
slint = { version = "1.19", features = ["backend-winit", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
] }
